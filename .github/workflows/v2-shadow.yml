# Owner-approved V2-only capture. No native cron; dispatched by the separate Free Worker.
name: V2 separate shadow capture
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-shadow-capture
  cancel-in-progress: false
jobs:
  capture:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: source
      - name: Fail before acquisition unless owner activation is recorded
        working-directory: source
        run: |
          python - <<'PY'
          import json
          p=json.load(open('research/v2/shadow/ACTIVATION.json'))
          assert p['enabled'] and p['activation_approved'] and p['approval_reference']
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v2-shadow-state
          fetch-depth: 0
          path: state
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
        working-directory: source
      - name: Restore separate state and perform bounded tick
        id: capture
        working-directory: source
        run: |
          mkdir -p "$RUNNER_TEMP/v2-shadow-ledger"
          if [ -d ../state/ledger ]; then cp -R ../state/ledger/. "$RUNNER_TEMP/v2-shadow-ledger/"; fi
          python scripts/v2_shadow_tick.py --output "$RUNNER_TEMP/v2-shadow-ledger" --state-checkout ../state
      - name: Persist add-only evidence, including source-outage receipts
        if: ${{ !cancelled() && steps.capture.outcome != 'skipped' }}
        working-directory: source
        run: |
          git -C ../state config user.name github-actions[bot]
          git -C ../state config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/v2_shadow_state.py --checkout ../state --ledger "$RUNNER_TEMP/v2-shadow-ledger"
      - name: Verify duplicate publication is a no-op
        working-directory: source
        run: |
          python - <<'PY'
          import os
          from scripts.v2_shadow_state import publish
          result=publish('../state',os.environ['RUNNER_TEMP']+'/v2-shadow-ledger')
          assert result['changed'] is False, result
          print('Duplicate publication: no new commit or overwritten evidence')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ failure() }}
        with:
          name: v2-shadow-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/v2-shadow-ledger/
          retention-days: 7
