name: Manual local-build checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-checks
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Reviewed immutable dependencies; see docs/ACTIONS_LOCK.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.2'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - run: python scripts/test_release.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test && npm run test:release && npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /nfl-predictor/
      - run: npm audit --audit-level=moderate
        working-directory: web
